name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build (portable + installer)
        shell: pwsh
        run: |
          $attempt = 0
          $maxAttempts = 3
          while ($true) {
            $attempt++
            npm run dist:win
            $code = $LASTEXITCODE
            if ($code -eq 0) { break }
            Write-Host "Build failed (exit $code), attempt $attempt/$maxAttempts"
            if ($attempt -ge $maxAttempts) { exit $code }
            Start-Sleep -Seconds 10
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Launcher-windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: DSH-Launcher-windows-x64
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
